services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=backend
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      opensearch-setup:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ay}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ay}"
      POSTGRES_DB: "${POSTGRES_DB:-ay_catalog}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ay} -d ${POSTGRES_DB:-ay_catalog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch-node1:
    image: opensearchproject/opensearch:2.17.0
    environment:
      cluster.name: ay-search
      node.name: opensearch-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 4g
    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -k -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    ports:
      - "${DASHBOARDS_HOST_PORT:-5601}:5601"
    environment:
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
    volumes:
      - ./opensearch/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml
    depends_on:
      opensearch-node1:
        condition: service_healthy

  opensearch-setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run search:setup --workspace=backend
    env_file:
      - ./backend/.env
    restart: "no"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      opensearch-node1:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_PROXY_TARGET: "http://backend:3001"
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  osdata:
