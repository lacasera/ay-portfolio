services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=backend
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ay}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ay}"
      POSTGRES_DB: "${POSTGRES_DB:-ay_catalog}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ay} -d ${POSTGRES_DB:-ay_catalog}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_PROXY_TARGET: "http://backend:3001"
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
