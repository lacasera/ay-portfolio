services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=backend
    env_file:
      - ./backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace=frontend
    env_file:
      - ./frontend/.env
    environment:
      VITE_PROXY_TARGET: "http://backend:3001"
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    depends_on:
      - backend
